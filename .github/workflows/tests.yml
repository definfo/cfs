name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Canonical build via the tests/ CMakeLists.txt on every supported host OS.
  functional-test:
    name: Test on (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@main

      - name: Configure
        run: cmake -S tests -B tests/.build -DUSE_COLORS=ON -DPRINT_ENV=ON

      - name: Build
        run: cmake --build tests/.build --config Debug

      - name: Run tests
        working-directory: tests/.build
        run: ctest -C Debug --output-on-failure
